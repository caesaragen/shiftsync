name: CI

# Manual-trigger only. GitHub Actions cannot run on this account at present, so
# automatic push/PR triggers would mark every commit failed without ever having
# executed a step. The pipeline below is the intended one: restore the `push`
# and `pull_request` triggers, and add the DATABASE_URL / DIRECT_URL /
# AUTH_SECRET repository secrets the build step reads, to turn it back on.
#
# Until then the same checks run locally: npm run lint && npm test &&
# npm run build && npx tsc --noEmit
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      - run: npx tsc --noEmit
